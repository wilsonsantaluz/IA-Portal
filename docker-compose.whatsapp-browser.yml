services:
  whatsapp-bridge:
    build: ./whatsapp-bridge
    restart: unless-stopped
    init: true
    environment:
      BRIDGE_SECRET: ${WHATSAPP_BRIDGE_SECRET:?Set a private random bridge secret}
      BRIDGE_CONTAINER: "true"
    volumes:
      - whatsapp_sessions:/data
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Internal only: no host ports, no public browser debugging endpoint.
  ai-gateway:
    environment:
      BrowserBridge__Enabled: ${WHATSAPP_BRIDGE_ENABLED:-true}
      BrowserBridge__Url: http://whatsapp-bridge:3010/
      BrowserBridge__Secret: ${WHATSAPP_BRIDGE_SECRET:?Set a private random bridge secret}
volumes:
  whatsapp_sessions:
