server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21m;

    # Meta verification uses a secret query parameter. Never log this URI,
    # including upstream errors; authentication/signature checks remain in .NET.
    location ~ ^/api/webhooks/whatsapp/?$ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://ai-gateway:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://ai-gateway:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
    }

    # SPA – React Router
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Revalidar o shell evita carregar bundles antigos após atualizar o portal.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Bundles versionados ausentes não devem receber o HTML da SPA.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Arquivos estáticos com cache
    location ~* \.(js|css|png|jpg|jpeg|gif|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
