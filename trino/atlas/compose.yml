services:
  atlas-trino:
    image: trinodb/trino:484@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - ./config.properties:/etc/trino/config.properties:ro
      - ./memory.properties:/etc/trino/catalog/memory.properties:ro
      - ./access-control.properties:/etc/trino/access-control.properties:ro
      - ./rules.json:/etc/trino/rules.json:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  atlas-loader:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: trino/atlas/loader.Dockerfile
    environment:
      ATLAS_TRINO_ENDPOINT: http://atlas-trino:8080
    depends_on:
      atlas-trino:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/tmp/atlas-ready').st_mtime < 120"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 120s
