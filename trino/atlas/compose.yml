services:
  atlas-trino:
    build:
      context: ../..
      dockerfile: trino/atlas/Dockerfile
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - ./config.properties:/etc/trino/config.properties:ro
      - ./memory.properties:/etc/trino/catalog/memory.properties:ro
      - ./access-control.properties:/etc/trino/access-control.properties:ro
      - ./rules.json:/etc/trino/rules.json:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/atlas-initialized && curl --fail --silent --output /dev/null http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
