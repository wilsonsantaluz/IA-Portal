services:
  qdrant:
    restart: unless-stopped
    image: qdrant/qdrant:v1.20.0
    profiles: [rag]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  ai-gateway:
    restart: unless-stopped
    build: ./ai-gateway
    depends_on: [ml-service, ocr-service]
    environment:
      ASPNETCORE_URLS: http://+:8080
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_ENABLED: ${DEEPSEEK_ENABLED:-true}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/}
      DEEPSEEK_DEFAULT_MODEL: ${DEEPSEEK_DEFAULT_MODEL:-deepseek-chat}
      DEEPSEEK_MODELS: ${DEEPSEEK_MODELS:-}
      DEEPSEEK_ALLOWED_ORIGINS: ${DEEPSEEK_ALLOWED_ORIGINS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1/}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-4.1}
      OPENAI_MODELS: ${OPENAI_MODELS:-}
      OPENAI_ALLOWED_ORIGINS: ${OPENAI_ALLOWED_ORIGINS:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-}
      OLLAMA_MODELS: ${OLLAMA_MODELS:-}
      OLLAMA_ALLOWED_ORIGINS: ${OLLAMA_ALLOWED_ORIGINS:-}
      OLLAMA_LOCAL_ORIGINS: ${OLLAMA_LOCAL_ORIGINS:-}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-deepseek}
      LITELLM_ENABLED: ${LITELLM_ENABLED:-false}
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000/v1/}
      LITELLM_ALLOWED_ORIGINS: ${LITELLM_ALLOWED_ORIGINS:-http://litellm:4000}
      LITELLM_MODELS: ${LITELLM_MODELS:-fast,balanced,reasoning}
      LITELLM_DEFAULT_MODEL: ${LITELLM_DEFAULT_MODEL:-fast}
      ConnectionStrings__PortalConnection: Data Source=/app/data/portal.db;Foreign Keys=True
      Signup__Enabled: ${ATLAS_PUBLIC_SIGNUP:-false}
      Signup__PublicUrl: ${PORTAL_PUBLIC_URL:-}
      Smtp__Host: smtp.gmail.com
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__AppPassword: ${SMTP_APP_PASSWORD:-}
      Jwt__Key: ${JWT_KEY:?Configure JWT_KEY no .env}
      Bootstrap__AdminEmail: ${ADMIN_EMAIL:?Configure ADMIN_EMAIL no .env}
      Bootstrap__AdminPassword: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD no .env}
      Demo__Atlas__SeedKnowledge: ${ATLAS_SEED_KNOWLEDGE:-false}
      Chat__UseAdvancedRag: ${USE_ADVANCED_RAG:-false}
      SQLITE_BACKUP_DIRECTORY: ${SQLITE_BACKUP_DIRECTORY:-/app/data/backups}
      LLM_PRICES_FILE: ${LLM_PRICES_FILE:-config/model-prices.json}
      ML_SERVICE_URL: http://ml-service:9081
      OCR_SERVICE_URL: http://ocr-service:8080
      TRINO_URL: ${TRINO_URL:-http://host.docker.internal:8081}
      TRINO_USER: ${TRINO_USER:-portal}
      TRINO_CATALOG: ${TRINO_CATALOG:-memory}
      Qdrant__Endpoint: http://qdrant:6333
    ports:
      - "127.0.0.1:9089:8080"
    volumes:
      - ./models:/app/models:ro
      - portal_data:/app/data
  ml-service:
    restart: unless-stopped
    build: ./ml-service
    environment:
      ASPNETCORE_URLS: http://+:9081
  ocr-service:
    restart: unless-stopped
    build: ./ocr-service
    environment:
      ASPNETCORE_URLS: http://+:8080
  portal-front:
    restart: unless-stopped
    build: ./front
    depends_on: [ai-gateway]
    ports:
      - "127.0.0.1:9080:80"
volumes:
  portal_data:
  qdrant_data:
