# Opt-in only: docker compose -f docker-compose.yml -f docker-compose.atlas.yml up --build
services:
  atlas-trino:
    restart: unless-stopped
    image: trinodb/trino:484@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - ./trino/atlas/config.properties:/etc/trino/config.properties:ro
      - ./trino/atlas/memory.properties:/etc/trino/catalog/memory.properties:ro
      - ./trino/atlas/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/atlas/rules.json:/etc/trino/rules.json:ro
    networks:
      atlas_demo:
        ipv4_address: 172.29.88.10
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  atlas-loader:
    restart: unless-stopped
    build:
      context: .
      dockerfile: trino/atlas/loader.Dockerfile
    environment:
      ATLAS_TRINO_ENDPOINT: http://atlas-trino:8080
    depends_on:
      atlas-trino:
        condition: service_healthy
    networks: [atlas_demo]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/tmp/atlas-ready').st_mtime < 660"]
      interval: 30s
      timeout: 5s
      retries: 24
      start_period: 120s
  ai-gateway:
    depends_on:
      atlas-loader:
        condition: service_healthy
    environment:
      Demo__Atlas__SeedKnowledge: "true"
      Demo__Atlas__OnlyKnowledge: "true"
      Demo__Atlas__PreferOrganization: "true"
      Demo__Atlas__DefaultProvider: ${ATLAS_AI_DEFAULT_PROVIDER:-}
      Demo__Atlas__DefaultModel: ${ATLAS_AI_DEFAULT_MODEL:-fast}
      Chat__UseAdvancedRag: "false"
      TRINO_CONNECTORS_FILE: /app/config/atlas-compose-sources.json
    volumes:
      - ./trino/atlas/sources.compose.json:/app/config/atlas-compose-sources.json:ro
    networks:
      - default
      - atlas_demo
networks:
  atlas_demo:
    ipam:
      config:
        - subnet: 172.29.88.0/24
